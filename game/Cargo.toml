[package]
name = "one-must-imagine"
version = "0.1.0"
edition = "2021"
description = "The simulation core for One Must Imagine — an idle game about pushers."
license = "MIT"

[lib]
# cdylib for the wasm build, rlib so `cargo test` can link the core natively.
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# wasm-bindgen is only needed when actually targeting the browser. Keeping it
# target-gated means `cargo test` on the host never has to download or compile
# it — the entire sim core is verifiable offline (ADR 0003: the boundary is a
# thin adapter over a pure-Rust core).
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[profile.release]
opt-level = "z"
lto = true
