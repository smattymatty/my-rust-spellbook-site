[workspace]
resolver = "3"
members = ["deploy"]

[package]
name = "rust-spellbook-static"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
askama = "0.16.0"
gray_matter = "0.3.2"
pulldown-cmark = "0.13.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
walkdir = "2.5.0"
